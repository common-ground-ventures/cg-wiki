name: Wiki source parity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python receipts/verify_wiki_source.py . receipts/wiki-source-manifest.json --tracked
